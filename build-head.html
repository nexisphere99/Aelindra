<!--
  Appended into <head> via tweego's --head flag (see build.sh). Kept
  at the project root rather than under src/ so tweego's own src/
  directory scan (which reads every .tw/.css/.js there as story
  content) never has a reason to touch it. Not a .tw passage either -
  tweego drops this in as raw HTML, so it's the right place for tags
  that have to exist outside SugarCube's own markup, like the favicon
  links below. SVG first (crisp at any size, and what every modern
  browser actually uses); the PNG is a fallback for older browsers
  that don't support SVG favicons, and doubles as the apple-touch-icon
  for anyone who bookmarks the game to a phone home screen. See
  assets/icons/favicon.svg for the source art + palette notes.
-->
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
